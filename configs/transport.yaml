# Box transport stage configuration.

enabled: true

box_detection:
  backend: foundationpose
  preferred_label: box
  ws_url: ws://192.168.20.102:9091
  neck_down_y: 0.35
  neck_time_sec: 4.0
  grasp_average_frames: 5

grasp_points:
  body_offset_m: -0.17
  outside_offset_m: 0.10
  clamp_offset_m: 0.03
  side_z_offset_m: 0.38
  clamp_control: admittance

two_hand_holding:
  left_hand_q: [0.2, 0.9, 0.35, 0.45, 0.56, 0.65]
  right_hand_q: [0.2, 0.9, 0.35, 0.45, 0.56, 0.65]
  lift_m: 0.15
  pullback_m: -0.20
  lift_duration_sec: 5.0
  pullback_duration_sec: 8.0
  second_lift_m: 0.0
  waist_joints: [-0.3, 0.3, 0.0, 0.0]  # mpc_state indices 3,4,5,6
  waist_weight: 1.0
  waist_duration_sec: 8.0
  waist_max_delta: 0.60

default_place_point:
  description: "2026-08-20 tested box position; use as default place-step box pose."
  source: navigation.transport_place_area
  map_pose: [-9.41538026566515, 3.786190846269941, -0.0018881712990937022, -0.002042785013786434, -0.002546765999154717, -0.6442150921871242, 0.7648374049500116]
  related_runtime_files:
    - data/runtime/transport_box_grasp_target_latest.json
    - data/runtime/transport_box_side_approach_latest.json
    - data/runtime/transport_box_clamp_latest.json
    - data/runtime/transport_box_lift_10cm_latest.json

navigation:
  start_goal: transport_start_area   # placeholder, not measured yet
  end_goal: transport_place_area

motion:
  use_mpc: true
  use_joint_constraints: true
  use_admittance_for_clamp: true
  max_z_m: 1.70
